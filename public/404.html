    <style>
      @font-face { font-family: Barlow; src: url(/assets/fonts/barlow-condensed-bold.woff2) format('woff2'); font-display: swap; }

      h1 em { font-style: normal; color: #386bff; }
      p { margin: 0 auto 28px; max-width: 420px; }

      a:hover { background: #ff69bd; }
      a:focus-visible { outline: 3px solid #386bff; outline-offset: 4px; }
