[build]
  # Netlify installs dependencies from package-lock.json automatically first.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The scorecard lives inside the page (#scorecard). Old shared links keep working.
[[redirects]]
  from = "/scorecard"
  to = "/#scorecard"
  status = 301
[[redirects]]
  from = "/scorecard/"
  to = "/#scorecard"
  status = 301
# Short link for texts and emails: straight to the 15-minute calendar (the
# Calendly event is 15 minutes despite its /30min address). Keep in sync with
# BOOKING_URL in src/site.js. 302, so it can change later without browsers
# remembering the old target.
[[redirects]]
  from = "/book"
  to = "https://calendly.com/adamthomasjanes/30min?utm_source=tinychipstudio.com&utm_medium=short-link&utm_campaign=book-call"
  status = 302

# Everything else that isn't a real file gets the friendly 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/badge/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
