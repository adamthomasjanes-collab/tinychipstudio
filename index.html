  <body>
    <div id="root"></div>

    <!-- Static twin of the project starter form, so Netlify Forms can detect it at deploy time.
         Field names must match src/components/Contact.jsx. -->
    <form name="project-starter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" /><input type="email" name="email" /><input type="url" name="website" />
      <input type="text" name="need" /><input type="text" name="budget" /><input type="text" name="timeline" />
      <textarea name="message"></textarea><input type="text" name="bot-field" />
    </form>
    <!-- Call requests from "Book a 15-minute call" (src/components/CallPanel.jsx). -->
    <form name="call-request" data-netlify="true" hidden>
      <input type="text" name="name" /><input type="tel" name="phone" /><input type="email" name="email" />
      <input type="text" name="day" /><input type="text" name="window" /><input type="text" name="topic" /><input type="text" name="note" />
    </form>
    <!-- "Send me the first fix" from the scorecard (src/components/ScorecardPanel.jsx). -->
    <form name="scorecard-plan" data-netlify="true" hidden>
      <input type="text" name="name" /><input type="email" name="email" /><input type="url" name="website" />
      <input type="text" name="stage" /><textarea name="summary"></textarea><textarea name="full"></textarea>
    </form>
