    <script>
      // Select the phone typography before the prerendered page first paints.
      (() => {
        const ua = navigator.userAgent;
        const instagramEntry = /^(?:https:\/\/(?:[\w-]+\.)*instagram\.com(?:\/|$)|android-app:\/\/com\.instagram\.android(?:\/|$))/i.test(document.referrer);
        if (/\bInstagram\b/i.test(ua) || (/;\s*wv\)/i.test(ua) && instagramEntry)) {
          document.documentElement.classList.add('instagram-browser');
        }
      })();
    </script>

    <div id="root"></div>

    <!-- Static twin of the project starter form, so Netlify Forms can detect it at deploy time.
         Field names must match src/components/Contact.jsx. -->
    <form name="project-starter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" /><input type="text" name="business" /><input type="email" name="email" /><input type="url" name="website" />
      <input type="text" name="need" /><input type="text" name="project" /><input type="text" name="budget" /><input type="text" name="timeline" />
      <textarea name="message"></textarea><input type="text" name="ref" /><input type="text" name="bot-field" />
    </form>
    <!-- Call requests (src/components/CallPanel.jsx): only used for old #book-call links when no calendar link is set. -->
    <form name="call-request" data-netlify="true" hidden>
      <input type="text" name="name" /><input type="tel" name="phone" /><input type="email" name="email" />
      <input type="text" name="day" /><input type="text" name="window" /><input type="text" name="topic" /><input type="text" name="note" />
    </form>
    <!-- "Send me the first fix" from the scorecard (src/components/ScorecardPanel.jsx). -->
    <form name="scorecard-plan" data-netlify="true" hidden>
      <input type="text" name="name" /><input type="email" name="email" /><input type="url" name="website" />
      <input type="text" name="stage" /><textarea name="summary"></textarea><textarea name="full"></textarea>
    </form>
